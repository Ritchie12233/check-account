name: check-account
services:
  web:
    image: check-account:local
    build:
      context: .
      dockerfile: Dockerfile.local
    init: true
    entrypoint: ["python", "/app/web/server.py"]
    ports:
      - "127.0.0.1:18765:18765"
    volumes:
      - ./web-data:/data
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    mem_limit: 512m
    cpus: 2
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "2"
  sherlock:
    profiles: [cli]
    image: check-account:local
    build:
      context: .
      dockerfile: Dockerfile.local
    init: true
    working_dir: /results
    volumes:
      - ./results:/results
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    mem_limit: 512m
    cpus: 2
    pids_limit: 128
    command: ["--help"]
